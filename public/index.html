<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Rivals Strategy Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Marvel Rivals Strategy Assistant</h1>
            <p>Your ultimate guide to dominating the battlefield</p>
        </header>
        
        <div class="chat-container">
            <div id="chat-history">
                <div class="message assistant">
                    <p>Welcome to the Marvel Rivals Strategy Assistant! How can I help you today?</p>
                    <p>You can ask about:</p>
                    <ul>
                        <li>Character abilities and roles</li>
                        <li>Team compositions</li>
                        <li>Synergies and counters</li>
                        <li>Game modes and ranking</li>
                    </ul>
                </div>
            </div>
            
            <div class="input-container">
                <textarea id="user-input" placeholder="Ask your question about Marvel Rivals..."></textarea>
                <button id="submit-btn">Send</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
